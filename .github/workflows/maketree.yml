# Regenerate the Makefile dependency diagram (maketree.svg) whenever a Makefile changes

name: Update Makefile diagram

on:
  push:
    paths:
      - '**/Makefile'
  workflow_dispatch:

permissions:
  contents: write

env:
  # raw URL of maketree.py in its gist, without a revision so the latest copy is used
  MAKETREE_URL: https://gist.githubusercontent.com/mlcollard/5d2945fa3f1cbf7013aa2cdfbf131727/raw/maketree.py

concurrency:
  group: maketree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download maketree.py
        run: curl -fsSL "$MAKETREE_URL" -o "$RUNNER_TEMP/maketree.py"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate diagrams
        run: |
          # one maketree.svg next to each Makefile in the repo
          git ls-files '*Makefile' | while read -r makefile; do
            dir=$(dirname "$makefile")
            python3 "$RUNNER_TEMP/maketree.py" "$makefile" -o "$dir/maketree.svg"
          done

      - name: Commit updated diagrams
        run: |
          git add -A -- '*maketree.svg'
          if git diff --cached --quiet; then
            echo "Diagrams already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Makefile diagram"
          git push
